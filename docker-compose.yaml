services:
  app:
    build: .
    image: twinbug-app
    restart: unless-stopped
    ports:
      - "8080"
    env_file: .env
    environment:
      AUTORUN_ENABLED: "true"
      DB_CONNECTION: sqlite
      DB_DATABASE: /data/database.sqlite
      DB_URL: ""
    volumes:
      - screenshots:/var/www/html/storage/app/public
      - sqlite_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/up"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  worker:
    build: .
    image: twinbug-app
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=200", "--max-time=3600"]
    env_file: .env
    environment:
      DB_CONNECTION: sqlite
      DB_DATABASE: /data/database.sqlite
      DB_URL: ""
    volumes:
      - screenshots:/var/www/html/storage/app/public
      - sqlite_data:/data
    depends_on:
      app:
        condition: service_healthy

volumes:
  screenshots:
  sqlite_data:
