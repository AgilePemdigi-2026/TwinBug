services:
  app:
    build: .
    image: twinbug-app
    restart: unless-stopped
    ports:
      - "8080"
    env_file: .env
    environment:
      AUTORUN_ENABLED: "true"
      DB_CONNECTION: sqlite
      DB_DATABASE: /data/database.sqlite
      DB_URL: ""
      ML_SERVICE_URL: http://ml:7860
      ML_API_KEY: ${ML_API_KEY:-}
    volumes:
      - screenshots:/var/www/html/storage/app/public
      - sqlite_data:/data
    depends_on:
      ml:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/up"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  worker:
    build: .
    image: twinbug-app
    restart: unless-stopped
    command: ["sh", "-c", "php artisan migrate --force && exec php artisan queue:work --sleep=3 --tries=3 --timeout=200 --max-time=3600"]
    env_file: .env
    environment:
      DB_CONNECTION: sqlite
      DB_DATABASE: /data/database.sqlite
      DB_URL: ""
      ML_SERVICE_URL: http://ml:7860
      ML_API_KEY: ${ML_API_KEY:-}
    healthcheck:
      test: ["CMD-SHELL", "grep -aq queue:work /proc/*/cmdline"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - screenshots:/var/www/html/storage/app/public
      - sqlite_data:/data
    depends_on:
      app:
        condition: service_healthy
      ml:
        condition: service_healthy

  ml:
    build: ./ml
    image: twinbug-ml
    restart: unless-stopped
    environment:
      ML_API_KEY: ${ML_API_KEY:-}
      PORT: "7860"
    ports:
      - "127.0.0.1:8001:7860"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7860/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

volumes:
  screenshots:
  sqlite_data:
