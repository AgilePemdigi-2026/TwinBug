<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 120" width="620" height="120" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1612" />
      <stop offset="50%" stop-color="#14201A" />
      <stop offset="100%" stop-color="#1B2C24" />
    </linearGradient>

    <!-- Icon Box Gradient -->
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#529966" />
      <stop offset="100%" stop-color="#366A46" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="glowAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ED692" />
      <stop offset="100%" stop-color="#418756" />
    </linearGradient>

    <!-- Soft Drop Shadow for Icon -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Main Card Container -->
  <rect width="620" height="120" rx="18" fill="url(#bgGradient)" stroke="#263E30" stroke-width="1.2" />

  <!-- Subtle Ambient Glow -->
  <circle cx="70" cy="30" r="50" fill="#4A7C59" opacity="0.12" />
  <circle cx="560" cy="90" r="60" fill="#5FA875" opacity="0.08" />

  <!-- Left: Icon Box -->
  <g transform="translate(36, 28)" filter="url(#cardShadow)">
    <rect width="64" height="64" rx="16" fill="url(#iconGradient)" stroke="#66B37E" stroke-width="1" stroke-opacity="0.4" />
    
    <!-- Stylized Modern Bug Icon -->
    <g transform="translate(16, 16)" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- Bug Outer Body Shield -->
      <path d="M16 4C10.477 4 6 8.477 6 14v4c0 5.523 4.477 10 10 10s10-4.477 10-10v-4c0-5.523-4.477-10-10-10z" fill="#FFFFFF" fill-opacity="0.12" />
      
      <!-- Central Spine & Split (Twin division) -->
      <path d="M16 8v20" />
      <path d="M6 15h20" />
      
      <!-- Antennae with terminal nodes -->
      <path d="M12 4L8 1" />
      <circle cx="7" cy="1" r="1" fill="#FFFFFF" />
      <path d="M20 4l4-3" />
      <circle cx="25" cy="1" r="1" fill="#FFFFFF" />
      
      <!-- Legs Left -->
      <path d="M6 11l-4-2" />
      <path d="M6 19l-4 2" />
      
      <!-- Legs Right -->
      <path d="M26 11l4-2" />
      <path d="M26 19l4 2" />
    </g>
  </g>

  <!-- Center-Left: Brand Typography -->
  <g transform="translate(122, 30)">
    <!-- Brand Name: TwinBug -->
    <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="32" font-weight="800" fill="#FFFFFF" letter-spacing="-0.8">
      Twin<tspan fill="#6ED692">Bug</tspan>
    </text>

    <!-- Version Pill -->
    <rect x="150" y="10" width="46" height="20" rx="10" fill="#1A2D22" stroke="#365C45" stroke-width="1" />
    <text x="173" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#7FD199" letter-spacing="0.5">BETA</text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#A1B9AB" letter-spacing="0.1">
      Platform Manajemen &amp; Pelaporan Bug Berbasis Web
    </text>
  </g>

  <!-- Right: Decorative Minimalist Twin Wave Graphic -->
  <g transform="translate(510, 44)" opacity="0.4" stroke="#6ED692" stroke-width="2" stroke-linecap="round">
    <path d="M0 16c8-12 16-12 24 0s16 12 24 0 16-12 24 0" />
    <path d="M0 24c8-12 16-12 24 0s16 12 24 0 16-12 24 0" opacity="0.4" />
  </g>
</svg>
